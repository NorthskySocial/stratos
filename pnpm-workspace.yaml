packages:
  - 'stratos-core'
  - 'stratos-service'
  - 'stratos-client'
  - 'stratos-indexer'
  - 'stratos-feedgen'
  - 'stratos-browser'
  - 'webapp'
  - 'clubhouse'
# The e2e docker containers install into the bind-mounted node_modules with a
# different pnpm store. The next host run must purge without a TTY prompt.
confirmModulesPurge: false
allowBuilds:
  '@sentry/cli': true
  core-js: true
  cpu-features: true
  esbuild: true
  ngrok: true
  protobufjs: true
  sharp: true
  ssh2: true
minimumReleaseAgeExclude:
  - '@atproto/crypto@0.0.0-spaces-alpha-20261124235736'
  - '@atproto/lex-schema@0.0.0-spaces-alpha-20261124235736'
  - '@atproto/space@0.0.0-spaces-alpha-20261124235736'
  - '@atproto/syntax@0.0.0-spaces-alpha-20261124235736'
  - '@sentry/browser-utils@11.19.0'
  - '@sentry/browser@11.19.0'
  - '@sentry/bundler-plugins@11.19.0'
  - '@sentry/core@11.19.0'
  - '@sentry/feedback@11.19.0'
  - '@sentry/node@11.19.0'
  - '@sentry/opentelemetry@11.19.0'
  - '@sentry/replay-canvas@11.19.0'
  - '@sentry/replay@11.19.0'
  - '@sentry/server-runtime-injection@11.19.0'
  - '@sentry/server-utils@11.19.0'
  - '@sentry/svelte@11.19.0'
  - '@sentry/vite-plugin@11.19.0'
  - '@types/node@26.6.11'
  - vite@8.4.0
