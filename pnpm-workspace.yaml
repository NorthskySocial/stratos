packages:
  - 'stratos-core'
  - 'stratos-service'
  - 'stratos-client'
  - 'stratos-indexer'
  - 'stratos-feedgen'
  - 'stratos-browser'
  - 'webapp'
  - 'clubhouse'
# The e2e docker containers install into the bind-mounted node_modules with a
# different pnpm store. The next host run must purge without a TTY prompt.
confirmModulesPurge: false
allowBuilds:
  '@sentry/cli': true
  core-js: true
  cpu-features: true
  esbuild: true
  ngrok: true
  protobufjs: true
  sharp: true
  ssh2: true
