packages:
  - 'stratos-core'
  - 'stratos-service'
  - 'stratos-client'
  - 'stratos-indexer'
  - 'stratos-feedgen'
  - 'stratos-browser'
  - 'webapp'
  - 'clubhouse'
# The e2e docker containers install into the bind-mounted node_modules with a
# different pnpm store. The next host run must purge without a TTY prompt.
confirmModulesPurge: false
allowBuilds:
  '@sentry/cli': true
  core-js: true
  cpu-features: true
  esbuild: true
  ngrok: true
  protobufjs: true
  sharp: true
  ssh2: true
# Verified ATProto security releases from PRs 5501–5504 and their dependencies.
minimumReleaseAgeExclude:
  - '@atproto-labs/did-resolver@0.3.9'
  - '@atproto-labs/fetch-node@0.4.0'
  - '@atproto-labs/fetch@0.3.6'
  - '@atproto-labs/handle-resolver-node@0.2.10'
  - '@atproto-labs/handle-resolver@0.4.9'
  - '@atproto-labs/identity-resolver@0.4.9'
  - '@atproto-labs/opentelemetry-node@0.2.1'
  - '@atproto-labs/xrpc-utils@0.1.22'
  - '@atproto/api@0.20.44'
  - '@atproto/bsky@0.0.280'
  - '@atproto/common-web@0.5.12'
  - '@atproto/common@0.8.3'
  - '@atproto/crypto@0.5.5'
  - '@atproto/did@0.5.5'
  - '@atproto/identity@0.5.13'
  - '@atproto/lex-builder@0.1.15'
  - '@atproto/lex-client@0.3.6'
  - '@atproto/lex-document@0.1.11'
  - '@atproto/lex-installer@0.1.20'
  - '@atproto/lex-resolver@0.2.13'
  - '@atproto/lex-schema@0.2.7'
  - '@atproto/lex@0.3.11'
  - '@atproto/lexicon@0.7.14'
  - '@atproto/oauth-client-node@0.5.7'
  - '@atproto/oauth-client@0.8.7'
  - '@atproto/oauth-provider-api@0.8.3'
  - '@atproto/oauth-provider-ui@0.10.3'
  - '@atproto/oauth-provider@0.22.8'
  - '@atproto/oauth-scopes@0.5.12'
  - '@atproto/oauth-types@0.7.6'
  - '@atproto/repo@0.10.14'
  - '@atproto/sync@0.4.10'
  - '@atproto/syntax@0.7.6'
  - '@atproto/xrpc-server@0.13.1'
  - '@atproto/xrpc@0.8.13'
