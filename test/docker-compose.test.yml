services:
  valkey:
    image: valkey/valkey:8-alpine
    container_name: stratos-test-valkey
    restart: 'no'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:alpine
    container_name: stratos-nginx
    restart: 'no'
    ports:
      - '8443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ssl-certs:/etc/nginx/ssl:ro
    depends_on:
      ssl-init:
        condition: service_completed_successfully
      stratos:
        condition: service_healthy
    # healthcheck:
    #   test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://127.0.0.1/health"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5
    #   start_period: 5s

  ssl-init:
    image: alpine:latest
    container_name: stratos-ssl-init
    volumes:
      - ssl-certs:/ssl
    command:
      - sh
      - -c
      - |
        if [ ! -f /ssl/cert.pem ]; then
          apk add --no-cache openssl
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
            -keyout /ssl/key.pem -out /ssl/cert.pem \
            -subj '/CN=localhost/O=Stratos/C=US' \
            -addext 'basicConstraints=CA:FALSE' \
            -addext 'keyUsage=digitalSignature,keyEncipherment' \
            -addext 'extendedKeyUsage=serverAuth' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
          chmod 644 /ssl/*.pem
        fi

  stratos:
    networks:
      - default
    user: 1000:1000
    build:
      context: ..
      dockerfile: ./Dockerfile
      target: stratos
    container_name: stratos-test
    restart: 'no'
    ports:
      - '3100:3100'
      - '3010:3010'
      - '3302:3302'
    env_file:
      - .env
    environment:
      STRATOS_PORT: 3100
      STRATOS_DEV_MODE: 'true'
      STRATOS_ENROLLMENT_MODE: open
      # The space-credential delegation path and client attestation need a
      # replay store for single-use tokens. Without it they fail closed, and
      # the feedgen never obtains a credential.
      STRATOS_VALKEY_URL: redis://valkey:6379
      STRATOS_DATA_DIR: /app/data
      STRATOS_BLOB_STORAGE: local
      STRATOS_PUBLIC_URL: ${STRATOS_PUBLIC_URL:-http://127.0.0.1:3100}
      STRATOS_SERVICE_DID: ${STRATOS_SERVICE_DID:-did:web:127.0.0.1%3A3100}
      USE_OAUTH: ${USE_OAUTH:-true}
      STRATOS_OAUTH_CLIENT_ID: ${STRATOS_OAUTH_CLIENT_ID:-http://127.0.0.1:3100/client-metadata.json}
      STRATOS_OAUTH_CLIENT_URI: ${STRATOS_OAUTH_CLIENT_URI:-http://127.0.0.1:3100}
      STRATOS_OAUTH_REDIRECT_URI: ${STRATOS_OAUTH_REDIRECT_URI:-http://127.0.0.1:3100/oauth/callback}
      STRATOS_ADMIN_DIDS: ${STRATOS_ADMIN_DIDS:-}
      # The e2e feedgen enrolled as a service. The signingKey lets Stratos
      # verify the feedgen's inter-service JWTs without a network resolution
      # of its non-resolvable did:web. Bare boundary names are qualified
      # against the service DID at config load.
      STRATOS_SERVICE_ENROLLMENTS: '[{"did":"did:web:feedgen.test","signingKey":"did:key:zQ3shkb9BGsQPkg2fEWwwBbLiDuzryE1Rc1Sqka9dopGAuA5Z","boundaries":["swordsmith","aekea"]},{"did":"did:web:localhost%3A3302","signingKey":"did:key:zQ3shkb9BGsQPkg2fEWwwBbLiDuzryE1Rc1Sqka9dopGAuA5Z","boundaries":["swordsmith","aekea"]}]'
    depends_on:
      ssl-init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    volumes:
      - ./test-data:/app/data
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:3100/health',
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  pds-spaces:
    image: ghcr.io/bluesky-social/atproto:pds-spaces-alpha
    container_name: stratos-test-pds-spaces
    restart: 'no'
    network_mode: service:stratos
    depends_on:
      stratos:
        condition: service_started
    environment:
      PDS_PORT: 3010
      PDS_HOSTNAME: localhost
      PDS_DATA_DIRECTORY: /pds
      PDS_BLOBSTORE_DISK_LOCATION: /pds/blocks
      PDS_JWT_SECRET: spaces-test-jwt-secret-do-not-use-outside-tests
      PDS_ADMIN_PASSWORD: spaces-test-admin
      PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX: 3ee7e0ba1e6b6b1a8b0d8e4f7a2c9d1e5f8a3b6c9d2e5f8a1b4c7d0e3f6a9b2c
      PDS_PLC_URL: ${STRATOS_PLC_URL:-https://plc.directory}
      PDS_INVITE_REQUIRED: 'true'
      PDS_DEV_MODE: 'true'
      PDS_SERVICE_HANDLE_DOMAINS: .spike.test
      LOG_ENABLED: 'true'
      LOG_LEVEL: info
    volumes:
      - ./test-data/pds-spaces:/pds

  feedgen-webapp:
    profiles: ['browser-e2e']
    build:
      context: ..
      dockerfile: ./stratos-feedgen/Dockerfile
      target: feedgen
    container_name: stratos-test-feedgen-webapp
    restart: 'no'
    network_mode: service:stratos
    environment:
      FEEDGEN_SERVICE_DID: did:web:localhost%3A3302
      FEEDGEN_SIGNING_KEY: 097ce261481a889a756db476dceb6cc57596541c264675e9712c7252cfd1183c
      FEEDGEN_PUBLIC_URL: http://localhost:3302
      FEEDGEN_PORT: 3302
      FEEDGEN_MEMBERSHIP_SQLITE_PATH: /app/data/feedgen-membership.sqlite
      FEEDGEN_FEEDS_JSON: '{"feeds":[{"id":"swordsmith","boundary":"${STRATOS_SERVICE_DID:-did:web:127.0.0.1%3A3100}/swordsmith"},{"id":"aekea","boundary":"${STRATOS_SERVICE_DID:-did:web:127.0.0.1%3A3100}/aekea"}]}'
      STRATOS_SERVICE_URL: http://localhost:3100
      STRATOS_PUBLIC_URL: ${STRATOS_PUBLIC_URL:-http://127.0.0.1:3100}
      STRATOS_SERVICE_DID: ${STRATOS_SERVICE_DID:-did:web:127.0.0.1%3A3100}
      FEEDGEN_SPACE_SYNC_ENABLED: 'true'
      FEEDGEN_SPACE_SYNC_INTERVAL_MS: '2000'
      FEEDGEN_SPACE_SYNC_ALLOW_HTTP_HOSTS: http://localhost:3010
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:3302/health',
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  webapp:
    profiles: ['browser-e2e']
    build:
      context: ..
      dockerfile: ./webapp/Dockerfile
      args:
        VITE_STRATOS_URL: ${STRATOS_PUBLIC_URL:-http://127.0.0.1:3100}
        VITE_WEBAPP_URL: http://127.0.0.1:5173
        VITE_STRATOS_SERVICE_DID: ${STRATOS_SERVICE_DID:-did:web:127.0.0.1%3A3100}
        VITE_FEEDGEN_DID: did:web:localhost%3A3302
        VITE_FEEDGEN_FEED: swordsmith
        VITE_ATPROTO_HANDLE_RESOLVER: https://${PDS_HOST}
        VITE_ATPROTO_OAUTH_PROXY_URL: http://127.0.0.1:5173/pds
    container_name: stratos-test-webapp
    restart: 'no'
    ports:
      - '5173:80'
    environment:
      E2E_PDS_HOST: ${PDS_HOST}
      E2E_PDS_URL: https://${PDS_HOST}
    volumes:
      - ./nginx/webapp-pds.conf:/etc/nginx/templates/default.conf.template:ro
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost/',
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  webapp-pds:
    profiles: ['browser-e2e']
    build:
      context: ..
      dockerfile: ./webapp/Dockerfile
      args:
        VITE_STRATOS_URL: ${STRATOS_PUBLIC_URL}
        VITE_WEBAPP_URL: http://127.0.0.1:5174
        VITE_STRATOS_SERVICE_DID: ${STRATOS_SERVICE_DID}
        VITE_FEEDGEN_DID: did:web:localhost%3A3302
        VITE_FEEDGEN_FEED: swordsmith
        VITE_ATPROTO_HANDLE_RESOLVER: http://localhost:3010
        VITE_ATPROTO_OAUTH_PROXY_URL: http://127.0.0.1:5174/pds
    container_name: stratos-test-webapp-pds
    restart: 'no'
    ports:
      - '5174:80'
    environment:
      E2E_PDS_HOST: localhost:3010
      E2E_PDS_URL: http://stratos:3010
    volumes:
      - ./nginx/webapp-pds.conf:/etc/nginx/templates/default.conf.template:ro
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost/',
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  cloudflared:
    networks:
      - default
    image: cloudflare/cloudflared:latest
    container_name: stratos-cloudflared
    restart: 'no'
    command:
      - tunnel
      - --url
      - http://stratos:3100

networks:
  default:
    name: stratos-test-net

volumes:
  ssl-certs:
