server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /pds/ {
    proxy_pass ${E2E_PDS_URL}/;
    proxy_set_header Host ${E2E_PDS_HOST};
    proxy_ssl_name ${E2E_PDS_HOST};
    proxy_ssl_server_name on;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
