# Full E2E compose: Stratos + PostgreSQL + AppView test server
# Usage: docker compose -f docker-compose.test.yml -f docker-compose.e2e.yml up -d --build
#
# Services:
#   - stratos: Stratos service (port 3100)
#   - postgres: Shared PostgreSQL (port 5432) — databases: stratos, appview
#   - appview: Test AppView server (port 3200) — indexes from Stratos, serves feed endpoints

services:
  postgres:
    image: postgres:18-alpine
    container_name: stratos-e2e-postgres
    restart: 'no'
    environment:
      POSTGRES_USER: stratos
      POSTGRES_PASSWORD: stratos
      POSTGRES_DB: stratos
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
      - ./appview/init-appview-db.sql:/docker-entrypoint-initdb.d/01-appview.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stratos']
      interval: 3s
      timeout: 3s
      retries: 10

  stratos:
    environment:
      STORAGE_BACKEND: postgres
      STRATOS_POSTGRES_URL: postgres://stratos:stratos@postgres:5432/stratos
      STRATOS_DEV_MODE: 'true'
      # AppView and both feedgens enroll as services. The signingKey lets
      # Stratos verify each service's inter-service JWTs without resolving
      # its (non-resolvable) did:web over the network. This overlay replaces
      # the base-file value per-key, so both feedgen entries repeat here.
      STRATOS_SERVICE_ENROLLMENTS: '[{"did":"did:web:appview.test","signingKey":"did:key:zQ3shqu5PGsBcRm7NU1uXcmLsfuNV4LvTTuChtYJbiXnjQaE5","boundaries":["swordsmith","aekea"]},{"did":"did:web:feedgen.test","signingKey":"did:key:zQ3shkb9BGsQPkg2fEWwwBbLiDuzryE1Rc1Sqka9dopGAuA5Z","boundaries":["swordsmith","aekea"]},{"did":"did:web:localhost%3A3302","signingKey":"did:key:zQ3shkb9BGsQPkg2fEWwwBbLiDuzryE1Rc1Sqka9dopGAuA5Z","boundaries":["swordsmith","aekea"]}]'
    depends_on:
      postgres:
        condition: service_healthy

  appview:
    image: denoland/deno:latest
    container_name: stratos-e2e-appview
    restart: 'no'
    ports:
      - '3200:3200'
    working_dir: /app
    volumes:
      - ./appview:/app:ro
    command: ['run', '-A', '--unstable-net', 'server.ts']
    environment:
      APPVIEW_PORT: '3200'
      STRATOS_URL: http://stratos:3100
      APPVIEW_PG_URL: postgres://stratos:stratos@postgres:5432/appview
      APPVIEW_SERVICE_DID: did:web:appview.test
      STRATOS_SERVICE_DID: ${STRATOS_SERVICE_DID:-did:web:127.0.0.1%3A3100}
      APPVIEW_SIGNING_KEY: '0956d99570075b192e76269ca8781ae31679df438d3bab32c6dbb1abcb7e9cdc'
    depends_on:
      stratos:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'sh',
          '-c',
          'deno eval "const r = await fetch(\"http://localhost:3200/health\"); if (!r.ok) Deno.exit(1);"',
        ]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  pgdata:
