# Local feedgen overlay — compose ON TOP of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.feedgen.yml up -d
#
# Easiest path: let ../ops/scripts/feedgen-start.sh orchestrate this. It brings
# up the tunnel, extracts the public host, generates the signing key, then
# starts feedgen.
#
# If driving compose by hand, these must be set first:
#   1. FEEDGEN_HOST=<public-host>      (no scheme — e.g. abc-def.trycloudflare.com)
#   2. FEEDGEN_SIGNING_KEY=<privHex>   (from stratos-feedgen/local/gen-key.mjs)
#
# The feedgen service serves its own did:web document at /.well-known/did.json
# and the XRPC endpoints on the same origin, so the tunnel points straight at
# it — no reverse proxy needed.

services:
  # Ephemeral HTTPS tunnel to the feedgen service, mirroring the load-test setup.
  # trycloudflare prints its URL to the logs; feedgen-start.sh greps it out.
  # Swap for ngrok manually if you prefer — point it at localhost:3000.
  feedgen-cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: stratos-feedgen-tunnel
    restart: unless-stopped
    # No depends_on: the start script brings this up FIRST to learn the public
    # host, since did:web is host-dependent. cloudflared tolerates the upstream
    # being absent and retries.
    command: tunnel --no-autoupdate --url http://feedgen:3000

  feedgen:
    build:
      context: .
      dockerfile: stratos-feedgen/Dockerfile
      target: feedgen
    container_name: stratos-feedgen
    restart: unless-stopped
    environment:
      FEEDGEN_PORT: 3000
      FEEDGEN_SERVICE_DID: did:web:${FEEDGEN_HOST}
      FEEDGEN_SIGNING_KEY: ${FEEDGEN_SIGNING_KEY}
      STRATOS_SERVICE_URL: http://stratos:3100
      STRATOS_SERVICE_DID: ${STRATOS_SERVICE_DID}
      FEEDGEN_STORAGE_BACKEND: sqlite
      # Set an explicit path and mount storage to persist private feed data.
      # FEEDGEN_SQLITE_PATH: /app/data/feedgen.sqlite
      FEEDGEN_FEEDS_FILE: /app/config/feeds.yaml
      FEEDGEN_SUBSCRIBE_ENROLLMENTS: 'true'
      FEEDGEN_PLC_URL: ${STRATOS_PLC_URL:-https://plc.directory}
    ulimits:
      core: 0
    # Persistence is opt-in because the database contains private records.
    # volumes:
    #   - feedgen-data:/app/data
    volumes:
      - ./stratos-feedgen/feeds.local.yaml:/app/config/feeds.yaml:ro
    depends_on:
      stratos:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:3000/health',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

# To retain data across restarts, uncomment this with the feedgen volume above.
# volumes:
#   feedgen-data:
