name: Publish stratos packages to GitHub Packages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish stratos packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 8

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      # stratos-core is published for server-side consumers that depend on it
      # directly (indexer / service / feedgen). stratos-client does not
      # depend on it — it carries its own copy of enrollment discovery — so
      # this ordering is incidental: the client is installable whether or
      # not stratos-core is in the registry.
      - name: Build stratos-core
        run: pnpm --filter @northskysocial/stratos-core build

      - name: Check if stratos-core version already published
        id: core-version-check
        run: |
          VERSION=$(node -p "require('./stratos-core/package.json').version")
          if npm view "@northskysocial/stratos-core@${VERSION}" version --registry=https://npm.pkg.github.com 2>/dev/null; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "stratos-core ${VERSION} already published — skipping"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "stratos-core ${VERSION} not yet published — proceeding"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish stratos-core to GitHub Packages
        if: steps.core-version-check.outputs.skip == 'false'
        run: pnpm --filter @northskysocial/stratos-core publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build stratos-client
        run: pnpm --filter @northskysocial/stratos-client build

      - name: Check if stratos-client version already published
        id: version-check
        run: |
          VERSION=$(node -p "require('./stratos-client/package.json').version")
          if npm view "@northskysocial/stratos-client@${VERSION}" version --registry=https://npm.pkg.github.com 2>/dev/null; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "stratos-client ${VERSION} already published — skipping"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "stratos-client ${VERSION} not yet published — proceeding"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish stratos-client to GitHub Packages
        if: steps.version-check.outputs.skip == 'false'
        run: pnpm --filter @northskysocial/stratos-client publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build and push docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check if stratos image version already pushed
        id: stratos-image-check
        run: |
          VERSION=$(node -p "require('./stratos-service/package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          if docker manifest inspect "ghcr.io/northskysocial/stratos:${VERSION}" >/dev/null 2>&1; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "stratos ${VERSION} already pushed — skipping"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "stratos ${VERSION} not yet pushed — proceeding"
          fi

      - name: Build and push stratos image
        if: steps.stratos-image-check.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: stratos
          push: true
          tags: |
            ghcr.io/northskysocial/stratos:${{ steps.stratos-image-check.outputs.version }}
            ghcr.io/northskysocial/stratos:latest

      - name: Check if feedgen image version already pushed
        id: feedgen-image-check
        run: |
          VERSION=$(node -p "require('./stratos-feedgen/package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          if docker manifest inspect "ghcr.io/northskysocial/stratos-feedgen:${VERSION}" >/dev/null 2>&1; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "stratos-feedgen ${VERSION} already pushed — skipping"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "stratos-feedgen ${VERSION} not yet pushed — proceeding"
          fi

      - name: Build and push feedgen image
        if: steps.feedgen-image-check.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: stratos-feedgen/Dockerfile
          target: feedgen
          push: true
          tags: |
            ghcr.io/northskysocial/stratos-feedgen:${{ steps.feedgen-image-check.outputs.version }}
            ghcr.io/northskysocial/stratos-feedgen:latest
