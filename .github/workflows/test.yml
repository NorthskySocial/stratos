name: Run Lint, Prettier, and Tests on PR and Push

on:
  pull_request:
    branches:
      - main
      - develop
      - feat/*
  push:
    branches:
      - main
      - develop
      - feat/*
      - fix/*
      - chore/*

jobs:
  rust-feedgen-ng:
    name: Rust Feedgen NG
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint Feedgen NG
        run: cargo clippy --locked -p stratos-feedgen-ng --all-targets -- -D warnings

      - name: Test Feedgen NG protocol and SQLCipher contracts
        run: cargo test --locked -p stratos-feedgen-ng --no-fail-fast

      - name: Build Feedgen NG release binary
        run: cargo build --locked --release -p stratos-feedgen-ng

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Run check format
        run: pnpm prettier --check .

      - name: Run linter
        run: pnpm run lint

      - name: Build packages
        run: pnpm run build

      - name: Check generated lexicons are committed
        run: |
          git diff --exit-code stratos-client/src/lexicons.gen.ts || {
            echo "::error::stratos-client/src/lexicons.gen.ts is stale — run: pnpm --filter @northskysocial/stratos-client lexgen"
            exit 1
          }
          # git diff does not see untracked files. Fail if the generator
          # emits a new file or the bundle is deleted from git.
          untracked="$(git status --porcelain stratos-client/src/)"
          if [ -n "$untracked" ]; then
            echo "$untracked"
            echo "::error::stratos-client/src/ has untracked or changed generated output — run: pnpm --filter @northskysocial/stratos-client lexgen and commit the result"
            exit 1
          fi

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm test

      - name: Run E2E tests (Playwright container)
        run: pnpm run test:e2e:docker -- --project=chromium
        working-directory: webapp

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: webapp/playwright-report/
          retention-days: 30
