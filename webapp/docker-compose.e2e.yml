# Spins up the webapp vite dev server for Playwright e2e runs.
#
# The whole stratos monorepo (the parent of this directory) is mounted so the
# workspace dependencies resolve, and the Playwright container (launched
# separately by scripts/e2e-docker.sh) joins the `stratos-webapp-e2e` network
# and reaches this service at http://webapp:5173.
services:
  webapp:
    image: node:24-bookworm-slim
    working_dir: /workspace/webapp
    # Run as the host user. A root install into the bind mount leaves
    # root-owned files that break pnpm on the host.
    user: '${E2E_UID:-1000}:${E2E_GID:-1000}'
    environment:
      # Lets pnpm proceed non-interactively if it ever needs to touch the
      # mounted node_modules.
      CI: 'true'
      # Arbitrary host UIDs have no passwd entry in this image, so $HOME is
      # not writable. Give corepack a writable cache location.
      HOME: /tmp
      COREPACK_HOME: /tmp/corepack
    volumes:
      - ..:/workspace
    # Keep the pnpm version in sync with the host. A version mismatch makes
    # each side purge and rebuild the mounted node_modules.
    # `corepack enable` needs root, so invoke pnpm through corepack instead.
    command: >
      sh -c "corepack prepare pnpm@11.21.0 --activate &&
             corepack pnpm install --frozen-lockfile &&
             corepack pnpm run dev"
    ports:
      - '5173:5173'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:5173').then(()=>process.exit(0)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - e2e

networks:
  e2e:
    name: stratos-webapp-e2e
