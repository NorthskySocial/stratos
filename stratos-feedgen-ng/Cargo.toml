[package]
name = "stratos-feedgen-ng"
version = "0.1.0"
description = "Rust implementation of the Stratos Feedgen"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = "0.8.9"
async-trait = "0.1.92"
base64 = "0.23.1"
blake3 = "1.8.7"
bs58 = "0.5.1"
cid = "0.11.3"
futures-util = "0.3.34"
libc = "0.2.191"
p256 = { version = "0.14.0", features = ["ecdh", "ecdsa", "getrandom"] }
k256 = { version = "0.14.0", features = ["ecdsa"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_cbor = { version = "0.11.2", features = ["tags"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
rusqlite = { version = "0.43.0", features = ["bundled-sqlcipher"] }
serde_yaml = "0.9.34"
time = { version = "0.3.55", features = ["parsing"] }
url = "2.5.9"
serde_urlencoded = "0.7.1"
sha2 = "0.11.1"
hmac = "0.13.0"
hkdf = "0.13.0"
sfv = "0.16.1"
zeroize = "1.9.2"
multihash = "0.19.5"
opentelemetry = { version = "0.33.1", features = ["metrics"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["metrics"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["metrics", "http-proto", "reqwest-blocking-client"] }

[dev-dependencies]
http-body-util = "0.1.5"
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["metrics", "testing"] }
tower = { version = "0.5.3", features = ["util"] }
